name: Generate SEO post
on:
  schedule:
    - cron: "0 9 */2 * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "Article topic (leave empty to pick from topics.txt, then Search Console demand)"
        required: false
jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional: without it the generator falls back to proposing its own topic.
          GSC_SA_KEY: ${{ secrets.GSC_SA_KEY }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
          # Passed as env, not interpolated into the command line, so a topic
          # containing shell metacharacters can't run as a command.
          TOPIC: ${{ github.event.inputs.topic }}
        run: node scripts/generate-post.mjs "$TOPIC"
      - name: Commit and push
        run: |
          git config user.name "twinslytics-bot"
          git config user.email "bot@twinslytics.com"
          git add -A
          git commit -m "Add SEO post (automated)" || echo "no changes"
          git push
